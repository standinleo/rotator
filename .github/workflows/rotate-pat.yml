name: Rotate PAT Across Org Repositories

on:
  # Run on a schedule — every 80 days (adjust to match your PAT expiry policy)
  schedule:
    - cron: '0 9 1 */3 *'   # 09:00 UTC on the 1st of every 3rd month (~90 days)

  # Also allow manual trigger with optional overrides
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Name of the secret to update in each repo (e.g. MY_PAT)'
        required: true
        default: 'MY_PAT'
      new_token:
        description: 'New PAT value (leave blank to use the org-level NEW_PAT secret)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — list repos without updating secrets'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Minimal permissions — only what is needed
permissions:
  contents: read

jobs:
  rotate:
    name: Rotate PAT in Org Repos
    runs-on: ubuntu-latest

    steps:
      # ── 1. Determine inputs (works for both schedule and manual runs) ──────
      - name: Resolve inputs
        id: config
        env:
          # For scheduled runs, fall back to org/repo-level secrets
          SCHEDULE_SECRET_NAME: ${{ secrets.PAT_SECRET_NAME || 'MY_PAT' }}
          INPUT_SECRET_NAME:    ${{ github.event.inputs.secret_name }}
          INPUT_TOKEN:          ${{ github.event.inputs.new_token }}
          INPUT_DRY_RUN:        ${{ github.event.inputs.dry_run }}
        run: |
          # Secret name: prefer manual input, else use default from secrets
          SECRET_NAME="${INPUT_SECRET_NAME:-$SCHEDULE_SECRET_NAME}"
          echo "secret_name=${SECRET_NAME}" >> "$GITHUB_OUTPUT"

          # Dry run flag (false for scheduled runs)
          DRY_RUN="${INPUT_DRY_RUN:-false}"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

          echo "✅ Secret name  : ${SECRET_NAME}"
          echo "✅ Dry run mode : ${DRY_RUN}"

      # ── 2. Resolve the new token value ───────────────────────────────────
      #
      #   Priority:
      #     1. Manual workflow_dispatch input (new_token)
      #     2. Org/repo secret NEW_PAT  ← store your freshly-generated PAT here
      #
      #   We intentionally never print the token value.
      - name: Set new token
        id: token
        env:
          INPUT_TOKEN:   ${{ github.event.inputs.new_token }}
          FALLBACK_TOKEN: ${{ secrets.NEW_PAT }}
        run: |
          TOKEN="${INPUT_TOKEN:-$FALLBACK_TOKEN}"
          if [[ -z "$TOKEN" ]]; then
            echo "❌ No new token provided. Set the NEW_PAT secret or pass new_token as input."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"          # mask from logs
          echo "value=${TOKEN}" >> "$GITHUB_OUTPUT"

      # ── 3. Rotate the secret across all org repos ─────────────────────────
      #
      #   Requires a PAT with scope:  admin:org  (to list repos & write secrets)
      #   Store it as secret:         ROTATION_PAT
      #
      - name: Rotate secret across org repos
        env:
          GH_TOKEN:      ${{ secrets.ROTATION_PAT }}
          ORG:           ${{ github.repository_owner }}
          SECRET_NAME:   ${{ steps.config.outputs.secret_name }}
          NEW_TOKEN:     ${{ steps.token.outputs.value }}
          DRY_RUN:       ${{ steps.config.outputs.dry_run }}
        run: |
          set -euo pipefail

          echo "🔍 Fetching repos in org: ${ORG}"

          # Paginate through all repos in the org
          PAGE=1
          ALL_REPOS=()
          while true; do
            BATCH=$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${ORG}/repos?per_page=100&page=${PAGE}" \
              --jq '.[].full_name' 2>/dev/null || true)

            [[ -z "$BATCH" ]] && break
            while IFS= read -r repo; do
              ALL_REPOS+=("$repo")
            done <<< "$BATCH"
            ((PAGE++))
          done

          TOTAL=${#ALL_REPOS[@]}
          echo "📦 Found ${TOTAL} repositories"
          echo ""

          UPDATED=0
          SKIPPED=0
          FAILED=0

          for REPO in "${ALL_REPOS[@]}"; do
            # Check if the secret already exists in this repo
            STATUS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/secrets/${SECRET_NAME}" \
              --jq '.name' 2>/dev/null || echo "NOT_FOUND")

            if [[ "$STATUS" == "NOT_FOUND" ]]; then
              echo "⏭️  SKIP  ${REPO}  (secret '${SECRET_NAME}' not set)"
              ((SKIPPED++))
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "🔎  DRY   ${REPO}  (would rotate '${SECRET_NAME}')"
              ((UPDATED++))
              continue
            fi

            # Rotate: set the new secret value
            if gh secret set "${SECRET_NAME}" \
                --repo "${REPO}" \
                --body "${NEW_TOKEN}" 2>/dev/null; then
              echo "✅  DONE  ${REPO}"
              ((UPDATED++))
            else
              echo "❌  FAIL  ${REPO}"
              ((FAILED++))
            fi
          done

          echo ""
          echo "──────────────────────────────────────"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "🔎 Dry-run complete"
            echo "   Would update : ${UPDATED}"
            echo "   Would skip   : ${SKIPPED}"
          else
            echo "🎉 Rotation complete"
            echo "   Updated : ${UPDATED}"
            echo "   Skipped : ${SKIPPED}"
            echo "   Failed  : ${FAILED}"
          fi
          echo "──────────────────────────────────────"

          if [[ "$FAILED" -gt 0 ]]; then
            echo "⚠️  Some repos failed — check logs above."
            exit 1
          fi

      # ── 4. (Optional) Notify on failure ───────────────────────────────────
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -n "${SLACK_WEBHOOK}" ]]; then
            curl -s -X POST "${SLACK_WEBHOOK}" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"❌ PAT rotation failed! Check the run: ${RUN_URL}\"}"
          else
            echo "No SLACK_WEBHOOK_URL set — skipping notification."
          fi
